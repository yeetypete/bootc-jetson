# The image ships both iGPU driver stacks, and both name their modules nvidia,
# nvidia-modeset and nvidia-drm. Resolve them to Thor's openrm copies. On Orin,
# jetson-gpu-select.service redirects them to the nvgpu copies at boot.
override nvidia-drm * updates/tegra-igpu-openrm-jetson
override nvidia-modeset * updates/tegra-igpu-openrm-jetson
override nvidia-uvm * updates/tegra-igpu-openrm-jetson
override nvidia * updates/tegra-igpu-openrm-jetson
