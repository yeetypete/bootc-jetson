# Orin (tegra234) drives its GPU with nvgpu. depmod resolves nvidia,
# nvidia_modeset and nvidia_drm to Thor's openrm copies, which /usr cannot change
# at runtime. On Orin, jetson-gpu-select.service links this file over
# /usr/lib/modprobe.d/nvidia-display.conf, and the rules below insert the nvgpu
# copies by path instead. Each rule first loads the dependencies modinfo lists.
#
# nvgpu must claim the GPU before nvidia.ko. nvgpu provides UVM itself, so
# nvidia-uvm must not load. insmod reads no modprobe.d options, so the options
# from Canonical's nv-modprobe-nvgpu-l4t-display.conf are passed directly.
install nvidia_uvm /bin/false
install nvidia \
    /sbin/modprobe -a nvgpu ecdh_generic ecdsa_generic ecc tegra_dce host1x mc_utils && \
    /sbin/insmod /usr/lib/modules/$(uname -r)/updates/tegra-igpu-nvgpu-jetson/nvidia.ko
install nvidia_modeset \
    /sbin/modprobe -a nvidia host1x video && \
    /sbin/insmod /usr/lib/modules/$(uname -r)/updates/tegra-igpu-nvgpu-jetson/nvidia-modeset.ko \
    disable_hdmi_frl=1 hdmi_deepcolor=0
install nvidia_drm \
    /sbin/modprobe -a nvidia_modeset host1x && \
    /sbin/insmod /usr/lib/modules/$(uname -r)/updates/tegra-igpu-nvgpu-jetson/nvidia-drm.ko \
    modeset=1
