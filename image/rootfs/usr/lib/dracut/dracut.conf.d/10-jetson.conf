# Newer dracut requires these to be set explicitly.
systemdsystemconfdir=/etc/systemd/system
systemdsystemunitdir=/usr/lib/systemd/system

# The PCIe, storage and fan drivers for both SoCs. Thor's (tegra264) and Orin's
# (tegra194/234) controllers differ, so both sets go into the one initramfs.
add_drivers+=" pcie_tegra264 ufs_tegra tegra_vblk pcie_tegra194 phy_tegra194_p2u pwm_fan pwm_tegra tegra_bpmp_thermal "
