# Disable the onboard Realtek WiFi/BT radios (RTL8822CE on Orin, RTL8852CE on
# Thor) on these wired-only nodes. blacklist alone is not enough (udev
# auto-loads via modalias), so redirect the install to /bin/false too.
blacklist rtl8822ce
install rtl8822ce /bin/false
blacklist rtl8852ce
install rtl8852ce /bin/false
blacklist rtk_btusb
install rtk_btusb /bin/false
blacklist btusb
install btusb /bin/false
