# NVIDIA's 99-tegra-devices.rules assign the GPU debug nodes to this group.
g debug -

# CUDA opens /dev/dri/renderD128. Without this cuInit() fails with error 801.
m ubuntu render

# Otherwise nv_nvsciipc_preinit.service creates them in /etc with useradd at boot.
u nvsciipc 2000
u nvsciipc2 2001
m nvsciipc2 nvsciipc
