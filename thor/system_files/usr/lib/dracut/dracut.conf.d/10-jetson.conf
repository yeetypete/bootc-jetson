# Canonical installs the Tegra OOT modules flat under updates/, so dracut's
# path-based driver selection misses them.
add_drivers+=" pcie_tegra264 ufs_tegra tegra_vblk pwm_fan pwm_tegra tegra_bpmp_thermal "

# Keep the out-of-tree modules in updates/ (e.g. Wi-Fi, audio) out of initramfs.
omit_dracutmodules+=" kernel-modules-extra "
