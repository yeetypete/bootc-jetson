# From Canonical's nv-modprobe-openrm-l4t-display.conf, which the masked
# nv-load-display-modules.service would copy into /etc at boot.
#
# gpu_pg_mask lists every mask on one line, and nv-gpu-static-pg only accepts
# gpu_pg_mask_param, so extract that pair alone.
#
# nvidia-uvm needs nvidia, so loading it after a failed nvidia load would rerun
# this install command and recurse forever. Only load it once nvidia is in.
options nvidia-modeset disable_hdmi_frl=1 hdmi_deepcolor=0
options nvidia-drm modeset=1
install nvidia \
    gpu_pg_mask=$(grep -oE 'gpu_pg_mask_param=[^ ]+' /opt/nvidia/l4t-gpusetup/gpu_pg_mask 2>/dev/null); \
    /sbin/modprobe nv-gpu-static-pg ${gpu_pg_mask:+$gpu_pg_mask}; \
    /sbin/modprobe --ignore-install nvidia $CMDLINE_OPTS && \
    /sbin/modprobe nvidia-uvm
install nvgpu /bin/false
