# package: dbus-system-bus-common
g messagebus 102
u messagebus 102 - /nonexistent /usr/sbin/nologin
# package: systemd
g systemd-journal 999
g systemd-network 998
u systemd-network 998 "systemd Network Management" / /usr/sbin/nologin
# package: systemd-resolved
g systemd-resolve 989
u systemd-resolve 989 "systemd Resolver" / /usr/sbin/nologin
# package: systemd-timesyncd
g systemd-timesync 993
u systemd-timesync 993 "systemd Time Synchronization" / /usr/sbin/nologin
# package: udev
g render 994
g input 992
g sgx 991
g kvm 990
# package: uuid-runtime
g uuidd 101
u uuidd 101 - /run/uuidd /usr/sbin/nologin
# package: openssh-client
g _ssh 103
# package: avahi-daemon
g avahi 104
g netdev 105
u avahi 103:104 "Avahi mDNS daemon,,," /run/avahi-daemon /usr/sbin/nologin
# package: dhcpcd-base
u dhcpcd 100:65534 "DHCP Client Daemon,,," /usr/lib/dhcpcd /bin/false
# package: openssh-server
u sshd 104:65534 - /run/sshd /usr/sbin/nologin
# package: -
g ubuntu 1000
g crypto 997
g trusty 996
g debug 995
u ubuntu 1000 Ubuntu /home/ubuntu /bin/bash
m ubuntu adm
m ubuntu dialout
m ubuntu cdrom
m ubuntu floppy
m ubuntu sudo
m ubuntu audio
m ubuntu dip
m ubuntu video
m ubuntu plugdev
