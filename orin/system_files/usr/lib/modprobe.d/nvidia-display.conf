# From Canonical's nv-modprobe-nvgpu-l4t-display.conf, which the masked
# nv-load-display-modules.service would copy into /etc at boot. nvgpu provides
# UVM itself, so nvidia-uvm must not load.
options nvidia-modeset disable_hdmi_frl=1 hdmi_deepcolor=0
options nvidia-drm modeset=1
install nvidia_uvm /bin/false
